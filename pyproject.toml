[project]
name = "romav2"
version = "2.0.1"
description = "RoMa v2: Harder Better Faster Denser Feature Matching"
readme = "README.md"
authors = [
    { name = "Johan Edstedt", email = "johan.edstedt@liu.se" }
]
requires-python = ">=3.10"
dependencies = [
    "einops>=0.8.1",
    "pillow>=12.0.0",
    "rich>=14.2.0",
    "torch",
    "torchvision>=0.23.0",
    "tqdm>=4.67.1",
    "fused-local-corr ; sys_platform == 'linux'",
    "h5py>=3.12",
    "mujoco>=3.10.0",
    "sam3",
    "pycocotools>=2.0.11",
    "psutil>=7.2.2",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[project.optional-dependencies]
eval = [
    "kornia>=0.8.2",
    "matplotlib>=3.10.7",
    "opencv-python>=4.10,<4.12",
    "wandb>=0.23.0",
    "wxbs-benchmark>=0.0.4",
]
dev = [
    "pytest>=8.0.0",
    "slurm-util>=0.2.7",
    "ruff>=0.14.5",
]
setup = [
    "gdown>=5.2.0",
    "modelscope>=1.33.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }
sam3 = { git = "https://github.com/facebookresearch/sam3.git" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true
